name: Quarterly Content Review

on:
  schedule:
    # Run on the 1st of January, April, July, and October at 09:00 UTC
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quarterly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Generate quarterly review checklist
        run: node ai/scripts/content-review.mjs
      
      - name: Commit review checklist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ai/reviews/ ai/logs/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "chore: quarterly content review checklist [automated]"
            git push
          fi
      
      - name: Create issue for review
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const quarter = Math.ceil((new Date().getMonth() + 1) / 3);
            const year = new Date().getFullYear();
            
            const body = `## Quarterly Content Review - Q${quarter} ${year}
            
            A new content review checklist has been generated: \`ai/reviews/content-review-${date}.md\`
            
            ### Action Items:
            1. Review the checklist and check for tool updates
            2. Update \`src/_data/toolVersions.cjs\` with any new versions
            3. Update quickstart guides and examples if needed
            4. Update the CHANGELOG.md with significant changes
            5. Close this issue when review is complete
            
            ### Tools to Review:
            - Debezium
            - Apache Kafka
            - Matillion
            - AWS DMS
            - Fivetran
            - Oracle GoldenGate
            
            See the full checklist in the repository for detailed review items.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quarterly Content Review - Q${quarter} ${year}`,
              body: body,
              labels: ['documentation', 'quarterly-review', 'automated']
            });
      
      - name: Log run
        if: always()
        run: node ai/scripts/log-agent-run.mjs
        env:
          AGENT_NAME: site-content-review
          STATUS: ${{ job.status == 'success' && 'ok' || 'failed' }}
          DURATION_MS: 0
