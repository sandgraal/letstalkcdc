name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# pa11y / pa11y-ci depend on puppeteer, whose postinstall downloads a
# Chrome build on every `npm ci` and fails the step when the download
# providers are unreachable ("Failed to set up chrome-headless-shell ...
# All providers failed"). No job uses that download: the e2e job uses
# Playwright's own browser, and smoke/a11y point puppeteer at the
# runner's google-chrome-stable via PUPPETEER_EXECUTABLE_PATH. (The
# PUPPETEER_SKIP_CHROMIUM_DOWNLOAD set on those two steps is the
# pre-v20 name and is ignored by puppeteer 24; it is
# PUPPETEER_EXECUTABLE_PATH that has been skipping the download there.)
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # ───────────────────────────────────────────────────
  # Job 1: Build the site and cache the artifact
  # ───────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
          retention-days: 1

  # ───────────────────────────────────────────────────
  # Job 2: Lint (parallel with build)
  # ───────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier --check .

  # ───────────────────────────────────────────────────
  # Job 3: Unit tests (parallel with build)
  # ───────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ───────────────────────────────────────────────────
  # Job 3: Security audit (parallel with build)
  # ───────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --production

  # ───────────────────────────────────────────────────
  # Job 4: Smoke tests (needs build artifact)
  # ───────────────────────────────────────────────────
  smoke-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Chrome
        # `chromium-browser` on Ubuntu 24.04 (Noble) is a Snap
        # transitional package — `apt install` hangs in CI because
        # snapd isn't running. google-chrome-stable is a real .deb
        # and the dl.google.com repo is preconfigured on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Smoke tests
        run: npm run smoke
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

  # ───────────────────────────────────────────────────
  # Job 5: Accessibility with pa11y (needs build)
  # ───────────────────────────────────────────────────
  a11y-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Chrome
        # See the smoke-tests job above for why google-chrome-stable
        # instead of chromium-browser on Ubuntu 24.04 runners.
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Accessibility tests (pa11y)
        run: npm run a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

  # ───────────────────────────────────────────────────
  # Job 6: E2E tests with Playwright (needs build)
  # ───────────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ───────────────────────────────────────────────────
  # Job 7: Lighthouse score gate (needs build)
  # ───────────────────────────────────────────────────
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Don't reuse the `site-build` artifact: the production build
      # emits asset URLs under the `/letstalkcdc/` path prefix, but
      # scripts/lighthouse-ci.mjs serves `_site/` at root, so referenced
      # assets 404 and the audit measures an unstyled page.
      # `build:lhci` is the same build pipeline with
      # `ELEVENTY_PATH_PREFIX=/`, producing a root-deployable artifact
      # that Lighthouse can actually exercise.
      - name: Build root-prefixed site for Lighthouse
        run: npm run build:lhci

      # Uses the Chrome preinstalled on the runner (or $CHROME_PATH).
      # Needs Node 22.19+ (lighthouse 13).
      - name: Run Lighthouse
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # `.lighthouseci/` is a dot-directory; without this the action
          # skips it and uploads nothing.
          include-hidden-files: true
          retention-days: 14
