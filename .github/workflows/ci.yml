name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────
  # Job 1: Build the site and cache the artifact
  # ───────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
          retention-days: 1

  # ───────────────────────────────────────────────────
  # Job 2: Lint (parallel with build)
  # ───────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier --check .

  # ───────────────────────────────────────────────────
  # Job 3: Unit tests (parallel with build)
  # ───────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ───────────────────────────────────────────────────
  # Job 3: Security audit (parallel with build)
  # ───────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --production

  # ───────────────────────────────────────────────────
  # Job 4: Smoke tests (needs build artifact)
  # ───────────────────────────────────────────────────
  smoke-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Smoke tests
        run: npm run smoke
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

  # ───────────────────────────────────────────────────
  # Job 5: Accessibility with pa11y (needs build)
  # ───────────────────────────────────────────────────
  a11y-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Accessibility tests (pa11y)
        run: npm run a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

  # ───────────────────────────────────────────────────
  # Job 6: E2E tests with Playwright (needs build)
  # ───────────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ───────────────────────────────────────────────────
  # Job 7: Lighthouse CI (needs build)
  # ───────────────────────────────────────────────────
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
