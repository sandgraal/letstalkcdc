name: Link check
on:
  push:
  pull_request:
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          # Same repository variables as deploy.yml, so a domain move is a
          # variable change and the link check follows it. The literal after
          # `||` keeps the job working when a variable is unset (and for
          # runs where vars are unavailable). `||` also replaces an empty
          # value, which matches the build: lib/path-prefix.mjs and
          # lib/site-host.mjs both treat an empty value as unset. A site
          # served from the domain root is therefore configured with
          # ELEVENTY_PATH_PREFIX=/ (truthy, so it passes through), never
          # with an empty string.
          ELEVENTY_PATH_PREFIX: ${{ vars.ELEVENTY_PATH_PREFIX || '/letstalkcdc' }}
          SITE_HOST: ${{ vars.SITE_HOST || 'https://sandgraal.github.io' }}
        run: npm ci && npm run build && scripts/publish-playground.sh
      - uses: lycheeverse/lychee-action@v2.0.2
        env:
          # Authenticated requests to github.com avoid the rate-limited 404s
          # that show up under unauthenticated CI runs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # --exclude-loopback skips localhost/127.0.0.1 URLs that appear
          # inside <code> blocks documenting curl commands (Kafka Connect REST
          # examples). Those aren't reachable links.
          # --max-retries / --retry-wait-time make lychee retry a failed
          # request (a transient 5xx or timeout, e.g. the lone 503 from
          # GitHub Pages /versions/ that was healthy moments later) with a
          # longer pause than the 1s default. Retries, not --accept, are the
          # fix: a real 404 still fails the job.
          # --exclude skips the YouTube player embed only: youtube-nocookie.com
          # answers 404 to non-browser clients from CI runners while the same
          # URL returns 200 in a browser (checked with a browser User-Agent).
          # The video is still real; thumbnails and every other link are
          # still checked.
          args: --no-progress --verbose --exclude-loopback --exclude '^https://www\.youtube-nocookie\.com/embed/' --max-retries 5 --retry-wait-time 10 "_site/**/*.html"
