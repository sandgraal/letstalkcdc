name: Link check
on:
  push:
  pull_request:
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          # Same repository variables as deploy.yml, so a domain move is a
          # variable change and the link check follows it. The literal after
          # `||` keeps the job working when a variable is unset (and for
          # runs where vars are unavailable). `||` also replaces an empty
          # value, which matches the build: lib/path-prefix.mjs and
          # lib/site-host.mjs both treat an empty value as unset. A site
          # served from the domain root is therefore configured with
          # ELEVENTY_PATH_PREFIX=/ (truthy, so it passes through), never
          # with an empty string.
          ELEVENTY_PATH_PREFIX: ${{ vars.ELEVENTY_PATH_PREFIX || '/letstalkcdc' }}
          SITE_HOST: ${{ vars.SITE_HOST || 'https://sandgraal.github.io' }}
          # pa11y-ci (a devDependency) pulls in puppeteer, whose postinstall
          # downloads Chrome and fails `npm ci` when that download flakes.
          # Building the site needs no browser.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci && npm run build && scripts/publish-playground.sh
      - name: Resolve this site's public URL and repository (for --remap)
        id: own-site
        env:
          SITE_HOST: ${{ vars.SITE_HOST || 'https://sandgraal.github.io' }}
          ELEVENTY_PATH_PREFIX: ${{ vars.ELEVENTY_PATH_PREFIX || '/letstalkcdc' }}
          REPOSITORY: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          # Same host + prefix the build used, as an anchored regex for
          # lychee's --remap (a root-served site has an empty prefix). The
          # trailing `(/|$)` matches the site URL with or without its final
          # slash; the remap target ends in `/`, so both land on _site/.
          host="${SITE_HOST%/}"
          prefix="$(printf '%s' "$ELEVENTY_PATH_PREFIX" | sed 's#^/*##; s#/*$##')"
          if [ -n "$prefix" ]; then prefix="/${prefix}"; fi
          pattern="^$(printf '%s' "${host}${prefix}" | sed 's/[][\.*^$+?(){}|]/\\&/g')(/|\$)"
          echo "pattern=${pattern}" >> "$GITHUB_OUTPUT"
          # Root-relative links in the built HTML (href="/letstalkcdc/x")
          # resolve against --root-dir (_site), which puts them at
          # _site/letstalkcdc/x; this pattern strips the prefix again so they
          # land on _site/x. With no prefix it matches _site/ and maps it to
          # itself, which is harmless.
          ws="$(printf '%s' "$WORKSPACE" | sed 's/[][\.*^$+?(){}|]/\\&/g')"
          pfx="$(printf '%s' "$prefix" | sed 's/[][\.*^$+?(){}|]/\\&/g')"
          echo "rootdir-pattern=^file://${ws}/_site${pfx}/" >> "$GITHUB_OUTPUT"
          # This repository's own github.com URLs: owner/name come from the
          # run (github.repository), so a rename needs no edit here.
          repo="$(printf '%s' "$REPOSITORY" | sed 's/[][\.*^$+?(){}|]/\\&/g')"
          echo "repo-files=^https://github\.com/${repo}/(blob|tree|edit)/main/" >> "$GITHUB_OUTPUT"
          echo "repo-root=^https://github\.com/${repo}/?\$" >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@v2.9.0
        env:
          # Authenticated requests to github.com avoid the rate-limited 404s
          # that show up under unauthenticated CI runs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # --exclude-loopback skips localhost/127.0.0.1 URLs that appear
          # inside <code> blocks documenting curl commands (Kafka Connect REST
          # examples). Those aren't reachable links.
          # --exclude skips the YouTube player embed only: youtube-nocookie.com
          # answers 404 to non-browser clients from CI runners while the same
          # URL returns 200 in a browser (checked with a browser User-Agent).
          # The video is still real; thumbnails and every other link are
          # still checked.
          # --exclude '^https://docs\.opensearch\.org/latest/' (P17-69): from
          # CI runners the host redirects these pages to /latest/404.html,
          # which redirects to itself ("Too many redirects"). The two URLs
          # linked from src/non-kafka-cdc/ return 200 from a normal client
          # (curl -L, 5 redirects, verified 2026-10-13), so the links are
          # valid and the loop is runner-specific. Only /latest/ is excluded,
          # not the whole host.
          #
          # Request bursts (the cause of the [503] Service Unavailable runs on
          # github.com/<this repo>/blob/main/...): the page footer links
          # LICENSE-CONTENT.md from every page, so one URL was requested ~45
          # times at once under lychee's default of 128 concurrent requests,
          # and many PR runs do this at the same moment from shared runner
          # IPs. Fixed at the source first (the remaps and the concurrency
          # limit below), then --accept covers what is left (see the last
          # paragraph):
          # --remap points this site's own URLs at the files in this
          # checkout, so they are checked locally instead of over the
          # network. https://<host>/<prefix>/ -> _site/ means a page's
          # canonical/og:url is verified against the page built in this run
          # (a brand-new page no longer 404s until it deploys, and a link to
          # a page that does not exist still fails: "Cannot find file").
          # https://github.com/sandgraal/letstalkcdc/{blob,tree,edit}/main/
          # -> the checkout means a link to a repo file is verified against
          # the PR's own tree instead of the remote main branch; a missing
          # file still fails. The owner/name is github.repository (the
          # `repository` in src/_data/site.mjs is the same value). The repo
          # root URL (the footer's "GitHub" link, ~54 pages) is remapped to
          # the checkout root too: lychee resolves a directory to 200, so it
          # no longer goes over the network.
          # Not checked, by design: a #fragment (an anchor that does not
          # exist still passes) and a directory URL with no index.html
          # (also passes locally).
          # --max-concurrency 8 (default 128) bounds what is left: lychee's
          # in-run cache only answers a URL once a first request for it has
          # finished, so fewer requests in flight means fewer duplicates
          # hit the network.
          # NO --cache here, on purpose. lychee keys its cache on the
          # original URL, before the remap, and stores the result of the
          # file:// check as a 200 for it. A later run that restores the
          # cache then answers "[200] .../intro/ | Cached: OK" for a page
          # (or repo file) that was deleted or renamed in the meantime, for
          # up to --max-cache-age, which defeats the remap. Reproduced with
          # lychee 0.16.1: second run, _site/intro/ and a linked repo file
          # deleted, 0 errors. lychee 0.16 has no --cache-exclude-status or
          # way to exclude file:// results, and after the remap only ~13
          # distinct github.com URLs plus a few external links hit the
          # network, so the cache bought little. Do not re-add an
          # actions/cache step for .lycheecache without a separate pass for
          # external links only.
          #
          # What this job does NOT check: the live deployment. The previous
          # version fetched this site's public URLs over the network, i.e.
          # the previous deploy, in parallel with the deploy in flight.
          # Now those URLs are verified against the build in this run.
          # `npm run verify:deployment` (scripts/deployment-verify.mjs)
          # checks the live site and is a manual command.
          # --max-retries/--retry-wait-time are kept for timeouts. Note that
          # lychee does NOT retry a 5xx response (checked against the 0.16.1
          # this action bundles: one request, no wait), so retries were never
          # a fix for a 503; the settings above are.
          # --accept (P17-63): the ~13 distinct external github.com URLs that
          # are still requested (other projects' blob/tree pages: debezium,
          # confluent, memiiso/...) answered [503] Service Unavailable on
          # runner IPs in some runs and a different URL each time, and passed
          # on re-run. A retry does not help (no 5xx retry), and ignoring
          # them one by one never ends. So 429, 503 and 504 count as success:
          # the transient statuses of a healthy host that is shedding load.
          # The list REPLACES lychee's default, so the default
          # (100..=103,200..=299) is repeated. Everything else still fails:
          # 404, 410, 403, 500, 502, DNS and TLS errors, timeouts, and a
          # missing local file after the remaps. Trade-off: a page that is
          # down for a long time with one of these three statuses is not
          # caught here either; it shows in the verbose log with its status
          # code, and a manual lychee run finds it.
          # --root-dir (P17-70): newer lychee refuses root-relative links in
          # local files without a root dir ("Cannot resolve root-relative
          # link"). It is set to the built site, and the first --remap below
          # strips the public path prefix from the resolved file:// URL.
          # lychee 0.16 (lychee-action 2.0.2) rejects --root-dir, so this needs
          # lychee-action 2.9.0 or later.
          args: >-
            --no-progress --root-dir '${{ github.workspace }}/_site' --verbose --exclude-loopback
            --exclude '^https://www\.youtube-nocookie\.com/embed/'
            --exclude '^https://docs\.opensearch\.org/latest/'
            --max-concurrency 8
            --accept '100..=103,200..=299,429,503,504'
            --max-retries 5 --retry-wait-time 10
            --remap '${{ steps.own-site.outputs.rootdir-pattern }} file://${{ github.workspace }}/_site/'
            --remap '${{ steps.own-site.outputs.pattern }} file://${{ github.workspace }}/_site/'
            --remap '${{ steps.own-site.outputs.repo-files }} file://${{ github.workspace }}/'
            --remap '${{ steps.own-site.outputs.repo-root }} file://${{ github.workspace }}/'
            "_site/**/*.html"
