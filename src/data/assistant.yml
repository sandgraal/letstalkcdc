        "how do i test kafka connect",
      ]
    modules: []
    answer: >
      Test the contract, not the absence of duplicates. A CDC test plan has
      three parts. Contract tests assert the change-event envelope on a
      recorded fixture: op codes, before and after images, the key, the source
      position fields and the tombstone after a delete. Sink tests replay the
      same batch twice, shuffle events within a key and deliver a delete before
      an older update, and require the final table to equal in-order
      application by log position. Reconciliation checks (counts, checksums by
      key range, max position per key) catch what injected events cannot. The
      acceptance tests page checks the lab stack; this plan checks your
      pipeline.
