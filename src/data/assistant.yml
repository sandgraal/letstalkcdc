  - id: materialization
    triggers:
      [
        "upsert",
        "merge",
        "delete",
        "sink",
        "target table",
        "materialize",
        "apply changes",
      ]
    modules: ["materialization"]
    answer: >
      Materialization is the process of applying CDC events to a target system.
      Use MERGE or UPSERT patterns for inserts and updates, handle deletes via
      soft-delete flags or hard deletes, and consider compaction vs history
      tables based on your query needs.
    links:
