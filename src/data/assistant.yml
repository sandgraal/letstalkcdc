  - id: schema_changes
    triggers:
      [
        "ddl",
        "schema change",
        "alter table",
        "column",
        "schema evolution",
        "compatibility",
      ]
    modules: ["schema-evolution"]
    answer: >
      CDC connectors emit schema change events alongside data changes.
      Additive DDL (new columns, new tables) propagates automatically.
      Destructive DDL (drops, renames, type changes) requires downstream
      reconciliation. Use a schema registry for forward/backward compatibility.
    links:
      - label: Schema Evolution
        url: /schema-evolution/
        anchor: "#compatibility"
        preview: Compatibility levels and migration strategies.

  - id: outbox
    triggers:
      [
        "outbox",
        "transactional outbox",
        "outbox pattern",
        "dual write",
        "dual-write",
      ]
    modules: []
    answer: >
      The transactional outbox solves the dual-write problem. The application
      writes its business data and an event row to an outbox table in one
      atomic database transaction, and a log-based CDC process reads the
      committed outbox row from the log and publishes it to a message bus such
      as Kafka. An event is published if and only if the business transaction
      committed. It does not make delivery exactly-once, though. The publish
      step is at-least-once by default, so the sinks still need to be idempotent.
    links:
      - label: The Transactional Outbox Pattern
        url: /exactly-once/
        anchor: "#outbox"
        preview: The dual-write problem and how the outbox solves it.
      - label: Transactional outbox in practice
        url: /intro/
        anchor: "#core-components"
        preview: Write, publish and consume idempotently, with sample SQL.

  - id: idempotent_sink
    triggers:
      [
        "idempotent sink",
        "idempotent write",
        "idempotent upsert",
        "ts_ms",
        "order by lsn",
        "ordered by log position",
        "order by log position",
        "ordering by log position",
        "out of order",
        "out-of-order",
        "late arriving",
        "late-arriving",
        "arrival order",
      ]
    modules: []
    answer: >
      CDC delivery is at-least-once by default, and end-to-end exactly-once across
      systems is not achievable in general, so correctness comes from an
      idempotent sink. Upsert or MERGE on the primary key, and keep one row per
      key by ordering on the source log position (LSN or SCN), not on ts_ms,
      which is only a millisecond commit time and can tie for the same key. Do
      not rely on arrival order. Keep deletes as delete markers that carry
      their log position, so a late older update cannot bring the row back, and
      record the processed offset so restarts can resume safely.
    links:
      - label: Build idempotent merge logic
        url: /materialization/
        anchor: "#merge-title"
        preview: Order by log position, ts_ms only as a tie-break.
      - label: The Solution - Idempotent Consumers
        url: /exactly-once/
        anchor: "#idempotency"
        preview: Deterministic event IDs and deduplication at the sink.
      - label: Delivery guarantees set your expectations
        url: /event-envelope/
        anchor: "#delivery-title"
        preview: At-least-once, and the sink-side dedupe key.

  - id: target_ordering
    triggers:
      [
        "which row wins",
        "_change_sequence_number",
        "change sequence number",
        "sequence by",
        "auto cdc",
        "ordering field",
        "precombine",
        "merge mode",
        "commit time ordering",
        "event time ordering",
        "equality delete",
        "upsert-dedup-column",
        "bigquery cdc",
        "hudi ordering",
        "iceberg upsert",
        "delta merge",
        "snowflake stream",
      ]
    modules: ["which-row-wins"]
    answer: >
      Each warehouse or lakehouse target decides which version of a row wins in
      its own way, and several default to arrival or commit order. Name three
      things per target: the key, the ordering column and the delete marker. Make
      the ordering column the source log position, for example
      _CHANGE_SEQUENCE_NUMBER in BigQuery, SEQUENCE BY in Databricks, the
      ordering field in Hudi, or a position guard in a MERGE for Iceberg, Delta
      and Snowflake. Check each setting against your version of the vendor
      documentation.
    links:
      - label: Which row wins in your target
        url: /which-row-wins/
        anchor: "#at-a-glance-title"
        preview: Key, ordering and delete handling for six targets.
      - label: Making Sinks Bulletproof
        url: /partitioning/
        anchor: "#recon"
        preview: Why the log position, not a timestamp, is the version.

  - id: delete_markers
    triggers:
      [
        "delete marker",
        "soft delete",
        "deleted flag",
        "resurrect",
        "row came back",
        "deleted row came back",
        "zombie row",
        "apply as delete",
        "_change_type",
        "physical delete",
        "hard delete",
      ]
    modules: ["which-row-wins"]
    answer: >
      A physical delete removes the version along with the row, so a replayed
      older update can bring the key back. Keep a delete marker, which is a
      deleted flag plus the delete's log position, or rely on a target feature
      that remembers the delete for a stated time (two days by default in
      BigQuery CDC ingestion and Databricks AUTO CDC) and know that time. Act on
      the delete change event, not on the Kafka tombstone alone.
    links:
      - label: Delete markers
        url: /which-row-wins/
        anchor: "#deletes-title"
        preview: Why a physical delete is not enough.
      - label: Build idempotent merge logic
        url: /materialization/
        anchor: "#merge-title"
        preview: Delete markers in a MERGE.

  - id: exactly_once
    triggers:
      [
        "exactly once",
        "exactly-once",
        "idempotent",
        "duplicate",
        "deduplication",
        "at least once",
        "delivery guarantee",
        "at-least-once",
        "idempotency",
        "dedupe",
        "effectively once",
        "same event twice",
        "what guarantees does cdc",
        "delivery guarantees",
      ]
    modules: ["exactly-once", "event-envelope"]
    answer: >
      Exactly-once semantics (EOS) ensure each change event is applied exactly
      one time at the destination. This requires idempotent writes, transactional
      coordination, or deduplication. It depends on the hop. Kafka Connect
      offers an opt-in exactly-once mode for source connectors (Debezium
      documents it from 3.3) for the hop into Kafka, with caveats, and it is
      off by default. Kafka transactions do not reach a database, a warehouse
      load or an HTTP call, so the hop out of Kafka into a sink, and the
      pipeline end to end, are not exactly-once delivery. Most CDC pipelines
      use at-least-once delivery with idempotent sinks (primary key, ordered
      by source log position) to get exactly-once processing, and that is
      still needed even when the first hop is exactly-once.
    links:
      - label: Exactly-Once Semantics
        url: /exactly-once/
        anchor: "#per-hop"
        preview: Which hop can be exactly-once, how, and the caveats.
      - label: Event Envelope and Delivery
        url: /event-envelope/
        anchor: "#delivery-title"
        preview: Keys, payloads, tombstones, and ordering guarantees.

  - id: exactly_once_claims
    triggers:
      [
        "is cdc exactly once",
        "cdc exactly once",
        "is change data capture exactly once",
        "change data capture exactly once",
        "is debezium exactly once",
        "debezium exactly once",
        "does debezium support exactly once",
        "debezium support exactly once",
        "kafka connect exactly once",
        "connect exactly once",
        "exactly once source connector",
        "exactly.once.support",
        "exactly.once.source.support",
        "transaction.boundary",
        "vendor says exactly once",
        "exactly once claim",
        "exactly once marketing",
      ]
    modules: []
    answer: >
      Debezium documents at-least-once delivery and says it has no internal
      deduplication layer. From Debezium 3.3 it also documents an opt-in
      Kafka Connect mode (exactly.once.source.support=enabled on every worker,
      exactly.once.support=required on the connector, distributed mode, Connect
      3.3.0 or later) for the hop from the connector into Kafka only. Its own
      page says it is unclear whether the implementation is fully correct. So
      a vendor sentence that says exactly-once needs five questions: which
      hop, which connector and is the opt-in on, which sink, what happens on
      failover, and what dedupes. The sink still needs an upsert on the
      primary key that applies a change only if its source log position is
      newer.
    links:
      - label: Is CDC exactly-once? Per hop
        url: /is-cdc-exactly-once/
        anchor: "#claims-title"
        preview: Five questions that scope any exactly-once claim.
      - label: The Kafka Connect opt-in
        url: /is-cdc-exactly-once/
        anchor: "#connect-eos-title"
        preview: Settings, what the framework does, and the caveats Debezium lists.
      - label: Exactly-once, hop by hop
        url: /exactly-once/
        anchor: "#per-hop"
        preview: The summary table of what each hop can guarantee.

  - id: kafka_transactions_sink_offsets
    triggers:
      [
        "sendoffsetstotransaction",
        "read_committed",
        "kafka read_committed",
        "isolation.level read_committed",
        "transactional.id",
        "kafka transaction",
        "exactly_once_v2",
        "kafka streams exactly once",
        "streams exactly once",
        "sendoffsets",
        "offsets in the database",
        "offsets in the same transaction",
        "offsets in the sink",
        "store offsets in the database",
        "store the offset in the database",
        "commit offsets with the data",
        "exactly once into a database",
        "exactly once to a database",
        "exactly once to the sink",
        "what guarantee do i really have",
        "verify exactly once",
        "prove exactly once",
      ]
    modules: []
    answer: >
      Kafka transactions make writes to topics and the consumer offsets atomic,
      and a consumer sees only committed records when isolation.level is
      read_committed (the default, read_uncommitted, also returns records from
      aborted transactions). Kafka Streams does this with exactly_once_v2. The
      atomicity stops at Kafka: it does not include a database, so for an
      external sink the Kafka documentation suggests storing the consumer offset
      in the same database transaction as the data. That protects against a
      consumer replaying a record, not against a duplicate that is already in
      the topic at another offset, so the upsert still compares source log
      positions and keeps deletes as markers. To check what your pipeline gives,
      stop the sink, rewind its consumer group (and, if the sink stores offsets
      itself, reset or delete its stored offset row, otherwise nothing is
      replayed), replay, and confirm the table is unchanged.
    links:
      - label: Offsets in the sink's transaction
        url: /is-cdc-exactly-once/
        anchor: "#sink-title"
        preview: Offsets and data in one transaction, plus the position guard.
      - label: What guarantee do I really have?
        url: /is-cdc-exactly-once/
        anchor: "#decide-title"
        preview: A short decision flow from topic to sink.
      - label: Verify what your pipeline gives
        url: /is-cdc-exactly-once/
        anchor: "#verify-title"
        preview: Find duplicates in the topic and replay into the sink.

