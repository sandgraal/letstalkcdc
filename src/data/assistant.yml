  - id: event_envelope
    triggers:
      [
        "envelope",
        "change event look",
        "event look like",
        "event format",
        "event structure",
        "before image",
        "after image",
        "before and after",
        "before/after",
        "tombstone",
      ]
    modules: ["event-envelope"]
    answer: >
      A change event is an envelope, not just the new row. It carries op
      (insert, update or delete), ts_ms, a source block with the log position
      such as lsn, the primary key, and before and after images of the row. The
      primary key is the stable identifier for idempotent upserts, and the log
      position or transaction identifier is where you resume when reprocessing.
      The before image matters for audit pipelines, SCD Type 2 tables and cache
      invalidation. Soft deletes are stored as explicit tombstones, because
      compaction depends on them.
    links:
      - label: What lives inside the envelope
        url: /event-envelope/
        anchor: "#anatomy-title"
        preview: Field-by-field tour of a change event.
      - label: Why before/after images matter
        url: /event-envelope/
        anchor: "#images-title"
        preview: Audit, SCD Type 2, rollbacks and deduplication.
      - label: See a change become an event
        url: /intro/
        anchor: "#ced-title"
        preview: Edit a table and watch the change event it emits.

  - id: security_pii
    triggers:
      [
        "pii",
        "security",
        "sensitive",
        "mask",
        "mask a column",
        "masking",
        "gdpr",
        "right to erasure",
        "right-to-erasure",
        "erasure",
        "crypto-shredding",
        "privilege",
        "permissions",
        "encrypt",
        "access control",
      ]
    modules: ["security"]
    answer: >
      CDC copies your most sensitive tables into systems with different access
      control and a longer memory. Filter sensitive columns at the connector -
      exclude them, or capture them as a salted hash - rather than downstream.
      The CDC user needs replication-level privileges that usually cannot be
      scoped per table, so give it a dedicated account. Use TLS on every hop
      and tight ACLs on the topics, including the dead-letter queue. A delete
      event does not retract the earlier events that carried the data, so plan
      for erasure (never carry the identifier in the clear, compaction plus
      tombstones, or crypto-shredding) before the first production topic
      exists.
    links:
      - label: Filter at the connector, not downstream
        url: /security/
        anchor: "#filter-early-title"
        preview: Exclude or hash sensitive columns before they reach the broker.
      - label: CDC privileges are broader than read-only
        url: /security/
        anchor: "#privileges-title"
        preview: What Postgres, MySQL and Oracle need, and why it is wide.
      - label: Deletion requests and an append-only log
        url: /security/
        anchor: "#erasure-title"
        preview: Three ways to honour a right-to-erasure request.

  - id: non_relational
    triggers:
      [
        "mongo",
        "dynamodb",
        "dynamo db",
        "cassandra",
        "change stream",
        "oplog",
        "nosql",
        "non-relational",
        "nonrelational",
        "beyond relational",
      ]
    modules: ["non-relational"]
    answer: >
      The log-based idea carries to MongoDB, DynamoDB and Cassandra, but each
      relaxes a guarantee relational CDC gave you. MongoDB change streams read
      the oplog and give an ordered stream with a resume token on every event,
      but the oplog is capped by size, not time. DynamoDB Streams provides
      before and after images (set the view type), but retention is a fixed
      24 hours. Cassandra has
      no cluster-wide ordered log - CDC is per node, duplicates are structural
      and there is no before-image. In all three, assume at-least-once and keep
      an idempotent sink.
    links:
      - label: What transfers, and what does not
        url: /non-relational/
        anchor: "#what-transfers-title"
        preview: Ordering, key and before-image across the three sources.
      - label: MongoDB change streams
        url: /non-relational/
        anchor: "#mongodb-title"
        preview: Resume tokens as offsets, and the size-capped oplog.
      - label: DynamoDB Streams
        url: /non-relational/
        anchor: "#dynamodb-title"
        preview: A hard 24-hour horizon.
      - label: Cassandra CDC
        url: /non-relational/
        anchor: "#cassandra-title"
        preview: No cluster-wide ordered log.

  - id: transports
    triggers:
      [
        "pulsar",
        "kinesis",
        "pub/sub",
        "google pub/sub",
        "pubsub",
        "other than kafka",
        "instead of kafka",
        "without kafka",
        "transports",
      ]
    modules: ["event-envelope"]
    answer: >
      The change event envelope travels over other transports, but the ordering
      and retention guarantees underneath it differ, and your sink depends on
      them. Pulsar is the closest analogue to Kafka: ordering per partition,
      with Key_Shared keeping a key on one consumer, but a Shared subscription
      breaks per-key order. Kinesis orders per shard with a fixed retention
      window (24 hours by default) and no compaction, and resharding moves keys
      between shards. Google Pub/Sub has no ordering by default, so ordering
      must come from the event's log position, never from arrival. All four are
      at-least-once and none gives exactly-once into an external sink, so
      upsert on the primary key and break ties on log position, not ts_ms.
    links:
      - label: Transports other than Kafka
        url: /event-envelope/
        anchor: "#transports-title"
        preview: Ordering unit and retention for Kafka, Pulsar, Kinesis, Pub/Sub.
      - label: The Golden Rule of Kafka Ordering
        url: /partitioning/
        anchor: "#ordering"
        preview: Why all changes for one entity share a partition.

  - id: cdc_methods
    triggers:
      [
        "log-based",
        "log based",
        "trigger-based",
        "trigger based",
        "query-based",
        "query based",
        "polling",
        "types of cdc",
        "cdc methods",
        "cdc approaches",
        "ways to do cdc",
        "kinds of cdc",
        "which cdc method",
        "transaction log",
        "write-ahead log",
        "binlog",
        "redo log",
      ]
    modules: ["intro"]
    answer: >
      There are three ways to capture changes. Log-based CDC reads committed
      changes from the database transaction log (PostgreSQL WAL, MySQL binlog,
      SQL Server transaction log, Oracle redo). It has the lowest impact on the
      source and captures inserts, updates and deletes in order, but it needs
      elevated privileges and tuned log retention. Trigger-based CDC writes
      changes into shadow tables with database triggers. It works when log
      access is impossible, but it adds overhead to every transaction. Query-based
      CDC (polling) re-queries tables for changed rows. It is the simplest to
      start with, but it misses intermediate updates and hard deletes and its
      load on the source grows with polling frequency. This site treats
      log-based CDC as the default.
    links:
      - label: CDC methods
        url: /intro/
        anchor: "#cdc-methods"
        preview: Log-based, trigger-based and query-based CDC side by side.
      - label: Methods at a glance
        url: /intro/
        anchor: "#methods-comparison"
        preview: Scorecard of the three methods across six criteria.

