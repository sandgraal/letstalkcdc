  - id: delete_resurrection
    triggers:
      [
        "resurrect",
        "resurrection",
        "row came back",
        "row comes back",
        "rows come back",
        "reappear after",
        "come back after",
        "zombie row",
        "deleted row",
        "deleted rows",
        "delete marker",
        "delete markers",
        "purge marker",
        "purge a marker",
        "purge a delete marker",
        "update after a delete",
        "late update after",
      ]
    modules: []
    answer: >
      A sink that physically removes the row on a delete also removes the
      stored log position, so a replayed older update finds no row, inserts it
      again and the deleted row comes back. Keep the delete as a delete marker
      instead: a deleted flag plus the delete's source log position, with the
      payload set to null, and a guard that applies a change only when its
      position is greater than the stored one. Applying the delete twice is
      then harmless. A Kafka tombstone cannot do this job because it has no
      value and no position. Purge a marker only after every consumer has seen
      it and nothing that can be replayed (topic, dead-letter queue, archive,
      staging) holds an older event for that key.
    links:
      - label: Resurrection - the late, older update
        url: /deletes-stay-deleted/
        anchor: "#resurrection"
        preview: One key, five arrivals, two sinks.
      - label: Purging markers safely
        url: /deletes-stay-deleted/
        anchor: "#purge"
        preview: When a delete marker can finally be removed.
      - label: Making sinks bulletproof
        url: /partitioning/
        anchor: "#recon"
        preview: Version guards on the source log position.

  - id: tombstone_retention
    triggers:
      [
        "delete.retention.ms",
        "delete.retention",
        "delete retention",
        "consumer missed",
        "tombstone retention",
        "tombstones on delete",
        "tombstones.on.delete",
        "missed the tombstone",
        "miss the tombstone",
        "missed the delete",
        "tombstone expire",
        "tombstone expired",
        "tombstone removed",
        "tombstone alone",
        "does a tombstone delete",
        "tombstone delete the row",
      ]
    modules: []
    answer: >
      A Kafka tombstone is a record with a key and a null value. It tells the
      log cleaner of a compacted topic that older records for the key may be
      removed, and the tombstone itself is removed after delete.retention.ms
      (one day by default). A consumer that falls further behind than that can
      miss the delete. A tombstone does not delete a warehouse row by itself:
      it has no position, and many sinks ignore it unless configured (the
      Debezium JDBC sink needs delete.enabled set to true). Debezium follows
      each delete event with a tombstone while tombstones.on.delete is true,
      which is the default. If you flatten events, keep the delete event with
      its position instead of passing on only the bare tombstone.
    links:
      - label: Three things people call a delete
        url: /deletes-stay-deleted/
        anchor: "#three-deletes"
        preview: Delete event, tombstone and sink delete marker compared.
      - label: What a consumer that falls behind misses
        url: /deletes-stay-deleted/
        anchor: "#late-consumer"
        preview: delete.retention.ms and compacted topics.
      - label: Ordering and compaction
        url: /event-envelope/
        anchor: "#ordering"
        preview: Log position as the version, deletes and compaction.

  - id: erasure_stores
    triggers:
      [
        "delta vacuum",
        "vacuum retention",
        "delta time travel retention",
        "time travel retention and delete",
        "deleted data",
        "expire snapshot",
        "expire snapshots",
        "expire_snapshots",
        "snapshot expiry",
        "fail-safe",
        "right to be forgotten",
        "gdpr delete",
        "article 17",
        "erase from backups",
        "erase from the warehouse",
        "erasure in the warehouse",
        "data still exists",
        "after the delete event",
      ]
    modules: []
    answer: >
      The delete event changes the current table only. Other copies live on
      under their own settings. Delta keeps old versions for time travel (30
      days by default) and removes data files only when VACUUM runs, for files
      unreferenced longer than 7 days by default; with deletion vectors enabled
      a delete does not rewrite the file until REORG TABLE APPLY PURGE does.
      Check your version. Iceberg keeps old snapshots
      until expire snapshots runs. BigQuery has a 7 day time travel window by
      default and a 7 day fail-safe for the operations it lists. Snowflake has
      1 day of time travel by default (up to 90 on Enterprise) and a 7 day
      fail-safe. Dead-letter topics, staging tables, archives and backups are
      separate copies with their own schedules. This is engineering guidance,
      not legal advice: whether and when a copy must be erased, and whether an
      Article 17(3) exception applies, is for your lawyer to decide.
    links:
      - label: Trace one deleted row
        url: /deletes-stay-deleted/
        anchor: "#trace"
        preview: Every place a copy can live and the setting that governs it.
      - label: Erasure requests - the technical question
        url: /deletes-stay-deleted/
        anchor: "#erasure"
        preview: What the official text says and what to ask your lawyer.
      - label: What to do Monday
        url: /deletes-stay-deleted/
        anchor: "#monday"
        preview: A ten-step checklist.
      - label: Deletion requests and an append-only log
        url: /security/
        anchor: "#erasure"
        preview: Three ways to honour a right-to-erasure request.

  - id: non_relational
    triggers:
      [
        "mongo",
        "dynamodb",
        "dynamo db",
        "cassandra",
        "change stream",
        "oplog",
        "nosql",
        "non-relational",
        "nonrelational",
        "beyond relational",
      ]
    modules: []
    answer: >
      The log-based idea carries to MongoDB, DynamoDB and Cassandra, but each
      relaxes a guarantee relational CDC gave you. MongoDB change streams read
      the oplog and give an ordered stream with a resume token on every event,
      but the oplog is capped by size, not time. DynamoDB Streams provides
      before and after images (set the view type), but retention is a fixed
      24 hours. Cassandra has
      no cluster-wide ordered log - CDC is per node, duplicates are structural
      and there is no before-image. In all three, assume at-least-once and keep
      an idempotent sink.
    links:
      - label: What transfers, and what does not
        url: /non-relational/
        anchor: "#what-transfers-title"
        preview: Ordering, key and before-image across the three sources.
      - label: MongoDB change streams
        url: /non-relational/
        anchor: "#mongodb-title"
        preview: Resume tokens as offsets, and the size-capped oplog.
      - label: DynamoDB Streams
        url: /non-relational/
        anchor: "#dynamodb-title"
        preview: A hard 24-hour horizon.
      - label: Cassandra CDC
        url: /non-relational/
        anchor: "#cassandra-title"
        preview: No cluster-wide ordered log.

  - id: debezium_server_engine
    triggers:
      [
        "debezium server",
        "debezium embedded engine",
        "embedded engine",
        "debezium engine",
        "run debezium without kafka",
        "debezium without kafka",
        "debezium standalone",
        "debezium.sink.type",
        "debezium.source.offset.storage",
        "recordcommitter",
        "markprocessed",
        "handlebatch",
        "markbatchfinished",
        "offset flush interval",
        "offset.flush.interval.ms",
        "debezium offset storage",
        "managed cdc delivery guarantee",
        "datastream duplicates",
      ]
    modules: []
    answer: >
      Without Kafka the guarantee is still at-least-once. Debezium Server runs
      one connector and one sink and you set the offset store yourself (a file
      by default, or JDBC, Redis, or Kafka where your version allows). A crash
      repeats whatever was delivered after the last flushed offset. In the
      embedded engine, call markProcessed only after the record's effect is
      durable and markBatchFinished at the end of the batch; marking early
      loses changes on a crash. Debezium documents an exactly-once opt-in only
      for connectors on Kafka Connect. Datastream documents at-least-once with
      no ordering guarantee, and the other managed services state less. Keep
      the destination write an upsert ordered by the source log position.
    links:
      - label: Debezium Server and its sinks
        url: /non-kafka-cdc/
        anchor: "#server-title"
        preview: Offset stores, crash behaviour and what each sink states.
      - label: The embedded engine
