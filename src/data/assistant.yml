        preview: The commit-after-process contract.
      - label: Which path for which need
        url: /non-kafka-cdc/
        anchor: "#decide-title"
        preview: Server, engine, managed service or your own consumer.

  - id: search_index_sync
    triggers:
      [
        "sync elasticsearch",
        "elasticsearch from cdc",
        "elasticsearch cdc",
        "opensearch cdc",
        "sync a search index",
        "search index from cdc",
        "keep a search index in sync",
        "version_type=external",
        "version_type external",
        "external versioning",
        "index.gc_deletes",
        "gc_deletes",
        "elasticsearch version conflict",
        "elasticsearch delete resurrect",
        "redis cache from cdc",
        "sync redis cache",
        "redis version guard",
      ]
    modules: []
    answer: >
      Index by primary key with the source log position as the version and
      version_type=external. Elasticsearch then refuses a stale replay or a
      duplicate with a 409, which your consumer should treat as already
      applied. The version must be a non-negative 64-bit integer, so a text
      position such as an LSN string is rejected and a multi-part position must
      be packed into one integer. A delete takes a version too, but the store
      remembers it only for index.gc_deletes (60 seconds by default); after
      that an older replay can bring the document back. Raise the setting past
      your longest replay, or index a delete-marker document. For a Redis cache
      either invalidate on change, or use a script that writes only if the
      version is higher.
    links:
      - label: Search index and cache sync
        url: /non-kafka-cdc/
        anchor: "#search-title"
        preview: External versions, the delete window and a Redis guard.
      - label: The delete window
        url: /non-kafka-cdc/
        anchor: "#search-title"
        preview: What the probe saw at 1, 6, 56 and 61 seconds.
      - label: Delete markers
        url: /deletes-stay-deleted/
        preview: Why a delete must outlive the longest replay.

  - id: transports
    triggers:
      [
        "pulsar",
        "kinesis",
        "pub/sub",
        "google pub/sub",
        "pubsub",
        "other than kafka",
        "instead of kafka",
        "without kafka",
        "transports",
      ]
    modules: []
    answer: >
      The change event envelope travels over other transports, but the ordering
      and retention guarantees underneath it differ, and your sink depends on
      them. Pulsar is the closest analogue to Kafka: ordering per partition,
      with Key_Shared keeping a key on one consumer, but a Shared subscription
      breaks per-key order. Kinesis orders per shard with a fixed retention
      window (24 hours by default) and no compaction, and resharding moves keys
      between shards. Google Pub/Sub has no ordering by default, so ordering
      must come from the event's log position, never from arrival. All four are
      at-least-once by default and none gives exactly-once into an external sink, so
      upsert on the primary key and break ties on log position, not ts_ms.
    links:
      - label: Transports other than Kafka
        url: /event-envelope/
        anchor: "#transports-title"
        preview: Ordering unit and retention for Kafka, Pulsar, Kinesis, Pub/Sub.
      - label: The Golden Rule of Kafka Ordering
        url: /partitioning/
        anchor: "#ordering"
        preview: Why all changes for one entity share a partition.

  - id: cdc_methods
    triggers:
      [
        "log-based",
        "log based",
        "trigger-based",
        "trigger based",
        "query-based",
        "query based",
        "polling",
        "types of cdc",
        "cdc methods",
        "cdc approaches",
        "ways to do cdc",
        "kinds of cdc",
        "which cdc method",
      ]
    modules: []
    answer: >
      There are three ways to capture changes. Log-based CDC reads committed
      changes from the database transaction log (PostgreSQL WAL, MySQL binlog,
      SQL Server transaction log, Oracle redo). It has the lowest impact on the
      source and captures inserts, updates and deletes in order, but it needs
      elevated privileges and tuned log retention. Trigger-based CDC writes
      changes into shadow tables with database triggers. It works when log
      access is impossible, but it adds overhead to every transaction. Query-based
      CDC (polling) re-queries tables for changed rows. It is the simplest to
      start with, but it misses intermediate updates and hard deletes and its
      load on the source grows with polling frequency. This site treats
      log-based CDC as the default.
    links:
      - label: CDC methods
        url: /intro/
        anchor: "#cdc-methods"
        preview: Log-based, trigger-based and query-based CDC side by side.
      - label: Methods at a glance
        url: /intro/
        anchor: "#methods-comparison"
        preview: Scorecard of the three methods across six criteria.

