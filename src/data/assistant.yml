# Matching (src/js/assistant-matcher.js): every trigger that appears in the
# visitor's question scores 1, an intent listed for the current module scores
# +10, highest wins. On a TIE THE EARLIER INTENT WINS. The original intents keep
# their order; the newer, broader ones (start_here, cdc_methods, tool_choice,
# glossary ...) sit at the bottom so they never steal a tie from an older,
# more specific intent. outbox and idempotent_sink sit above exactly_once and
# materialization on purpose: they are the more specific answer there. A phrase
# can be given extra weight by listing it twice at different lengths (for
# example "learn change data" and "learn change data capture"). Triggers are lower case, must not contain apostrophes
# (they are parsed as JSON), and answers must not contain angle brackets or
# ampersands (they are rendered as HTML). Link urls are site-absolute
# (/intro/); the browser adds the base path. tests/unit/modules/
# assistant-knowledge-base.test.js pins the phrasings below.
intents:
  - id: cdc_basics
    triggers:
      [
        "what is cdc",
        "change data capture",
        "how cdc works",
        "how does cdc work",
        "how does change data capture work",
        "what does cdc do",
        "cdc explained",
        "cdc basics",
        "basics of cdc",
        "cdc 101",
        "introduction to cdc",
        "intro to cdc",
      ]
    modules: ["intro", "overview", "strategy"]
    answer: >
      Change Data Capture (CDC) streams database row-level changes to downstream
      systems in near real time. A CDC connector tails the database transaction
      log (WAL, binlog, redo log), converts each committed change into a
      structured event, and publishes it to a streaming platform like Kafka.
    links:
      - label: Interactive Introduction
        url: /intro/
        preview: Start with the visual walkthrough of CDC core concepts.
      - label: Series Overview
        url: /overview/
        preview: Browse all available learning modules.
      - label: Strategic Value of CDC
        url: /strategy/
        anchor: "#business-case"
        preview: Understand the business case for adopting CDC.

  - id: lag_handling
    triggers:
      [
        "lag",
        "backpressure",
        "slow downstream",
        "throughput",
        "latency",
        "delay",
        "falling behind",
      ]
    modules: ["observability", "ops-offsets", "multi-tenancy"]
    answer: >
      Lag is the delay between a committed source change and its appearance
      downstream. Manage it by right-sizing agents for peak WAL throughput,
      compressing batches, parallelizing partitions, and tuning sink flush
      parameters. Monitor the golden signal: replication lag in seconds.
    links:
      - label: Observability Basics
        url: /observability/
        anchor: "#signals-title"
        preview: Learn the golden signals for CDC monitoring.
      - label: Ops Offsets and Replays
        url: /ops-offsets/
        preview: Diagnose and fix common lag causes.

  - id: snapshot_strategy
    triggers:
      [
        "snapshot",
        "initial load",
        "bootstrap",
        "first sync",
        "initial snapshot",
        "snapshotting",
      ]
    modules: ["snapshotting"]
    answer: >
      Snapshots create an initial consistent dataset before streaming begins.
      The lifecycle follows five stages: Plan, Mark High-Watermark, Consistent
      Read, Stream from Boundary, and Validate. Choose between fast and
      consistent modes depending on your tolerance for locking.
    links:
      - label: Snapshotting Deep Dive
        url: /snapshotting/
        anchor: "#snapshot-lifecycle-title"
        preview: Full lifecycle walkthrough with interactive timeline.
      - label: Quickstart Postgres
        url: /quickstarts/quickstart-postgres/
        preview: Run your first snapshot in the Postgres quickstart.

  - id: offset_management
    triggers:
      ["offset", "resume", "reset", "recovery", "replay", "rewind", "resync"]
    modules: ["ops-offsets", "reconciliation-surgery"]
    answer: >
      Offsets record each log position processed. They enable resuming streams
      after restarts without data loss. Never delete offsets unless
      re-snapshotting; instead use a controlled reset workflow. Always verify
      downstream consistency after any offset manipulation.
    links:
      - label: Ops Offsets and Replays
        url: /ops-offsets/
        anchor: "#storage-title"
        preview: Learn about offset storage and safe rewind procedures.
      - label: Reconciliation and Offset Surgery
        url: /reconciliation-surgery/
        anchor: "#offset-surgery"
        preview: Advanced offset manipulation and repair procedures.

  - id: schema_changes
    triggers:
      [
        "ddl",
        "schema change",
        "alter table",
        "column",
        "schema evolution",
        "compatibility",
      ]
    modules: ["schema-evolution"]
    answer: >
      CDC connectors emit schema change events alongside data changes.
      Additive DDL (new columns, new tables) propagates automatically.
      Destructive DDL (drops, renames, type changes) requires downstream
      reconciliation. Use a schema registry for forward/backward compatibility.
    links:
      - label: Schema Evolution
        url: /schema-evolution/
        anchor: "#compatibility"
        preview: Compatibility levels and migration strategies.

  - id: outbox
    triggers:
      [
        "outbox",
        "transactional outbox",
        "outbox pattern",
        "dual write",
        "dual-write",
      ]
    modules: ["exactly-once"]
    answer: >
      The transactional outbox solves the dual-write problem. The application
      writes its business data and an event row to an outbox table in one
      atomic database transaction, and a log-based CDC process reads the
      committed outbox row from the log and publishes it to a message bus such
      as Kafka. An event is published if and only if the business transaction
      committed. It does not make delivery exactly-once, though. The publish
      step is still at-least-once, so the sinks still need to be idempotent.
    links:
      - label: The Transactional Outbox Pattern
        url: /exactly-once/
        anchor: "#outbox"
        preview: The dual-write problem and how the outbox solves it.
      - label: Transactional outbox in practice
        url: /intro/
        anchor: "#core-components"
        preview: Write, publish and consume idempotently, with sample SQL.

  - id: idempotent_sink
    triggers:
      [
        "idempotent sink",
        "idempotent write",
        "idempotent upsert",
        "ts_ms",
        "log position",
        "order by lsn",
        "out of order",
        "out-of-order",
        "late arriving",
        "late-arriving",
        "arrival order",
      ]
    modules: ["materialization", "exactly-once", "partitioning"]
    answer: >
      CDC delivery is at-least-once, and end-to-end exactly-once across
      systems is not achievable in general, so correctness comes from an
      idempotent sink. Upsert or MERGE on the primary key, and keep one row per
      key by ordering on the source log position (LSN or SCN), not on ts_ms,
      which is only a millisecond commit time and can tie for the same key. Do
      not rely on arrival order. Apply deletes as tombstones, and record the
      processed offset so restarts can resume safely.
    links:
      - label: Build idempotent merge logic
        url: /materialization/
        anchor: "#merge-title"
        preview: Order by log position, ts_ms only as a tie-break.
      - label: The Solution - Idempotent Consumers
        url: /exactly-once/
        anchor: "#idempotency"
        preview: Deterministic event IDs and deduplication at the sink.
      - label: Delivery guarantees set your expectations
        url: /event-envelope/
        anchor: "#delivery-title"
        preview: At-least-once, and the sink-side dedupe key.

  - id: exactly_once
    triggers:
      [
        "exactly once",
        "exactly-once",
        "idempotent",
        "duplicate",
        "deduplication",
        "at least once",
        "delivery guarantee",
      ]
    modules: ["exactly-once", "event-envelope"]
    answer: >
      Exactly-once semantics (EOS) ensure each change event is applied exactly
      one time at the destination. This requires idempotent writes, transactional
      coordination, or deduplication. Most CDC pipelines use at-least-once
      delivery with idempotent sinks as a practical alternative to full EOS.
    links:
      - label: Exactly-Once Semantics
        url: /exactly-once/
        preview: Visual walkthrough of ALO vs EOS plus transactional outbox.
      - label: Event Envelope and Delivery
        url: /event-envelope/
        anchor: "#delivery-title"
        preview: Keys, payloads, tombstones, and ordering guarantees.

  - id: multi_tenancy
    triggers:
