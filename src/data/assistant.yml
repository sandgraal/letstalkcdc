        "how do i test replay",
        "how to test replay",
        "how do i test idempotency",
        "how to test idempotency",
      ]
    modules: []
    answer: >
      To test a sink against at-least-once delivery, apply the same batch twice
      and assert the table is unchanged, then deliver every event twice in a
      shuffled order many times and assert the result equals in-order
      application by source log position. Add a case where the delete arrives
      before an older update for the same key: a sink that keeps the delete as
      a marker with its position stays deleted, while one that removes the row
      brings it back. Give the fixture two changes in the same millisecond, or
      a sink ordered by a timestamp will pass. Do not assert that the topic has
      no duplicates; Debezium documents that a crash can produce them.
